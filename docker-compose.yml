version: "3.8"

services:
  chatgptproxy:
    # A TAG vem do ./deploy.sh e muda a cada build. Isso não é capricho:
    #  - tag fixa aqui fazia qualquer `stack deploy` reverter o serviço para
    #    uma imagem velha, desfazendo correções já publicadas;
    #  - `:latest` fixo é pior ainda: o texto da especificação não muda entre
    #    builds, o swarm acha que não há o que fazer e o deploy vira NO-OP
    #    SILENCIOSO — horas de depuração em cima de código que nunca subiu.
    # Tag única por build resolve os dois. Use SEMPRE ./deploy.sh.
    # ARMADILHA (2026-09-09): o default era `latest`, tag que NUNCA existiu
    # nesta VPS — as imagens são datadas. Um `stack deploy` sem TAG no ambiente
    # trocava a imagem do serviço por uma inexistente e derrubava o proxy com
    # "No such image", sem relação aparente com o que se estava mudando.
    image: chatgptproxy:${TAG:-v20260826-110744}
    environment:
      PORT: "3000"
      API_KEY: "${API_KEY}"
      ACCOUNTS: "conta1,conta2,conta3"
      PROFILES_DIR: "/app/profiles"
      DEFAULT_MODEL: "gpt-5"
      ANSWER_TIMEOUT: "600"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      NOVNC_HINT: "na VPS rode /home/chatgptproxy/novnc.sh e siga as instrucoes"
    volumes:
      - /home/chatgptproxy/profiles:/app/profiles
      # Montado (em vez de copiado na imagem) para que corrigir o harness não
      # exija rebuild: editou o arquivo, o download já sai novo.
      - /home/chatgptproxy/harness:/app/harness:ro
      # O .exe vem do runner Windows do GitHub Actions; fica fora do git (8 MB
      # de binário não pertencem ao histórico) e é montado só para download.
      - /home/chatgptproxy/dist:/app/dist:ro
      - /home/chatgptproxy/vscode:/app/vscode:ro
      # /dev/shm de 64MB (padrão do Docker) sufoca o Chromium e vira timeout
      # relatado como bloqueio — lição cara aprendida no qwenproxy.
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824
    # A porta do noVNC NÃO é publicada de propósito: o firewall desta VPS está
    # com INPUT ACCEPT, e publicar no swarm (que só sabe host mode) deixaria o
    # noVNC SEM SENHA aberto na internet. Para logar, use ./novnc.sh, que abre
    # um túnel só no loopback.
    networks:
      - Nutef
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          # 2026-09-09: com 8G o container vivia em ~6,4G (tres janelas do
          # Chromium abertas) e o renderer MORRIA ao receber prompt grande — o
          # sintoma chegava como "Page crashed" e, no cliente, como
          # `Locator.fill`/`Page.goto` estourando, o que mandava procurar
          # defeito na UI do ChatGPT em vez de na memoria. O `reset` "resolvia"
          # porque liberava memoria, e por isso a falha parecia intermitente.
          # O host tem 32G, com ~15G livres.
          memory: 12G
      labels:
        traefik.enable: "true"
        traefik.http.routers.chatgptproxy.rule: "Host(`gptproxy.nutef.com`)"
        traefik.http.routers.chatgptproxy.entrypoints: "websecure"
        traefik.http.routers.chatgptproxy.tls.certresolver: "letsencryptresolver"
        traefik.http.services.chatgptproxy.loadbalancer.server.port: "3000"

networks:
  Nutef:
    external: true
